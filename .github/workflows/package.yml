name: Package c3addon

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          mkdir -p dist
          zip -r "dist/${GITHUB_REPOSITORY##*/}.c3addon" addon.json effect.fx effect.wgsl icon.svg lang
      - uses: actions/upload-artifact@v4
        with:
          name: c3addon
          path: dist/*.c3addon
